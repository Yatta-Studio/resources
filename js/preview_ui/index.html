<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UserCard Preview</title>

    <!-- Tailwind (Play CDN — fine for previews, not for production) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React + ReactDOM (dev builds give better warnings) -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- Compiles JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body class="min-h-screen bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      /* ============================================================
       UserCard — same as the project version, with TypeScript
       annotations stripped (in-browser Babel only handles JSX).
       ============================================================ */

      const statusStyles = {
        online: "bg-green-500",
        away: "bg-yellow-500",
        offline: "bg-gray-400",
      };

      function UserCard({ avatarUrl, fullName, username, status, onClick }) {
        const [imgError, setImgError] = useState(false);

        const initials = fullName
          .split(" ")
          .map((part) => part.charAt(0))
          .slice(0, 2)
          .join("")
          .toUpperCase();

        return (
          <div
            onClick={onClick}
            className={`flex items-center gap-4 rounded-xl border border-gray-200 bg-white p-4 shadow-sm transition-all duration-200 hover:border-gray-300 hover:shadow-md sm:p-5 ${
              onClick ? "cursor-pointer" : ""
            }`}
          >
            <div className="relative shrink-0">
              <div className="flex h-12 w-12 items-center justify-center overflow-hidden rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 text-sm font-semibold text-white sm:h-14 sm:w-14">
                {avatarUrl && !imgError ? (
                  <img
                    src={avatarUrl}
                    alt={fullName}
                    className="h-full w-full object-cover"
                    onError={() => setImgError(true)}
                  />
                ) : (
                  initials
                )}
              </div>
              {status && (
                <span
                  className={`absolute bottom-0 right-0 h-3 w-3 rounded-full border-2 border-white ${statusStyles[status]}`}
                  title={status}
                />
              )}
            </div>

            <div className="min-w-0">
              <p className="truncate text-sm font-semibold text-gray-900 sm:text-base">
                {fullName}
              </p>
              <p className="truncate text-xs text-gray-500 sm:text-sm">
                @{username}
              </p>
            </div>
          </div>
        );
      }

      /* ========================== Demo data ========================== */

      const users = [
        {
          id: 1,
          fullName: "Sarah Chen",
          username: "sarahc",
          status: "online",
          avatarUrl: "https://randomuser.me/api/portraits/women/44.jpg",
        },
        {
          id: 2,
          fullName: "Marcus Johnson",
          username: "mjohnson",
          status: "online",
          avatarUrl: "https://randomuser.me/api/portraits/men/32.jpg",
        },
        {
          id: 3,
          fullName: "Priya Patel",
          username: "priyap",
          status: "away",
          avatarUrl: "https://randomuser.me/api/portraits/women/65.jpg",
        },
        {
          id: 4,
          fullName: "Diego Ramírez",
          username: "dramirez",
          status: "offline",
          avatarUrl: "https://randomuser.me/api/portraits/men/75.jpg",
        },
        {
          id: 5,
          fullName: "Amara Okafor",
          username: "aokafor",
          status: "online",
        }, // no avatar → initials fallback
        {
          id: 6,
          fullName: "Tom Wilson",
          username: "twilson",
          avatarUrl: "https://randomuser.me/api/portraits/men/11.jpg",
        }, // no status dot
        {
          id: 7,
          fullName: "A Really Long Display Name For Truncation",
          username: "an_extremely_long_username_that_truncates",
          status: "away",
          avatarUrl: "https://randomuser.me/api/portraits/women/12.jpg",
        },
        {
          id: 8,
          fullName: "Elena Petrova",
          username: "epetrova",
          status: "online",
          avatarUrl: "https://broken-url.example/404.jpg",
        }, // broken image → onError fallback
      ];

      /* ========================== Preview app ========================== */

      function App() {
        const [lastClicked, setLastClicked] = useState(null);

        return (
          <div className="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
            <header className="mb-8">
              <h1 className="text-2xl font-bold text-gray-900 sm:text-3xl">
                Team Members
              </h1>
              <p className="mt-1 text-sm text-gray-500">
                Resize the window to watch the grid collapse (4 → 2 → 1
                columns). Click a card to fire its onClick handler.
              </p>
              {lastClicked && (
                <p className="mt-2 text-sm font-medium text-indigo-600">
                  Last clicked: {lastClicked}
                </p>
              )}
            </header>

            <div className="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
              {users.map((user) => (
                <UserCard
                  key={user.id}
                  avatarUrl={user.avatarUrl}
                  fullName={user.fullName}
                  username={user.username}
                  status={user.status}
                  onClick={() => setLastClicked(`@${user.username}`)}
                />
              ))}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
